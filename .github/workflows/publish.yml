name: Publish to PyPI

# Publishes pyvacs to PyPI when a GitHub release is published, using PyPI
# Trusted Publishing (OpenID Connect) - no long-lived API tokens are stored.
#
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   - PyPI project:   pyvacs
#   - Owner:          anarkiwi
#   - Repository:     pyvacs
#   - Workflow name:  publish.yml
#   - Environment:    pypi

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64}
          - {os: ubuntu-24.04-arm, target: aarch64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Not abi3: one wheel per interpreter found in the manylinux container.
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --locked --out dist --find-interpreter
      - name: Smoke test
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install numpy tqdm
          /tmp/smoke/bin/pip install --no-index --no-deps --find-links dist pyvacs
          /tmp/smoke/bin/python -c "import pyvacs._emu, pyvacs.emu"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyvacs
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Check distribution metadata
        run: pipx run twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
