name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # cargo test links the pyo3 cdylib's test harness against libpython.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # pyvacs-emu is exercised by the Python test suite.
      - name: Coverage
        run: cargo llvm-cov --workspace --exclude pyvacs-emu --locked --fail-under-lines 85

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.13t"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: py${{ matrix.python-version }}
      - name: ROM cache
        uses: actions/cache@v5
        with:
          path: tests/.romcache
          key: romcache-${{ hashFiles('tests/conftest.py') }}
          restore-keys: romcache-
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Check the extension keeps the GIL disabled
        if: endsWith(matrix.python-version, 't')
        run: python -c "import sys, pyvacs._emu; assert not sys._is_gil_enabled()"
      - name: Test with coverage
        run: pytest -n auto

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: black
        run: black --check src tests
      - name: pylint
        run: pylint src/pyvacs

  integration:
    # MAME `arcadia` end-to-end tests: the cross-check runs MAME from the
    # docker/mame.Dockerfile image; the hello-world render uses host mame + xvfb.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build MAME image
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/mame.Dockerfile
          tags: pyvacs-mame
          load: true
          cache-from: type=gha,scope=mame
          cache-to: type=gha,scope=mame,mode=max
      - name: Install MAME and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mame xvfb
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: ROM cache
        uses: actions/cache@v5
        with:
          path: tests/.romcache
          key: romcache-${{ hashFiles('tests/conftest.py') }}
          restore-keys: romcache-
      - name: Install pyvacs
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run MAME integration tests
        env:
          PYVACS_MAME_DOCKER: pyvacs-mame
        run: pytest -m integration --no-cov -v -n auto

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
